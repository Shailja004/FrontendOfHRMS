
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<!-- Boxicons -->
	<link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
	<!-- My CSS -->

	<title>AdminHub</title>
</head>
<body>
	<!-- SIDEBAR -->
	<section id="sidebar">
		<a class="brand">
			<i class='bx bxs-user'></i>
			<span class="text">HRMS</span>
		</a>
		<ul class="side-menu top">
			<li class="active">
				<a>
					<i class='bx bxs-dashboard' ></i>
					<span class="text" (click)="redirectToDashboard()">Dashboard</span>
				</a>
			</li>
			<li>
				<a>
					<i class='bx bxs-detail'></i>
					<span class="text" (click)="redirectToApplicantform()">Applicants</span></a>
					<!-- <button class="text" (click)="redirectToApplicantform()">Applicants</button> -->
			</li>
			<li>
				<a>
					<i class='bx bxs-group' ></i>
					<span class="text">Departments</span>
				</a>
			</li>
			<li>
				<a>
					<i class='bx bxs-id-card' ></i>
					<span class="text" (click)="redirectToAlljobs()">All Jobs</span>
				</a>
			</li>
			<li>
				<a>
					<i class='bx bxs-report' ></i>
					<span class="text">Report</span>
				</a>
			</li>
			<li>
				
			</li>
		</ul>
		<ul class="side-menu">
			<li>
				<a>
					<i class='bx bxs-cog'></i>
					<span class="text">Settings</span>
				</a>
				
			</li>
			<li>
				<a href="#" class="logout">
					<i class='bx bxs-log-out-circle' ></i>
					<span class="text">Logout</span>
				</a>
			</li>
		</ul>
	</section>
	<!-- SIDEBAR -->



	<!-- CONTENT -->
	<section id="content">
		<!-- NAVBAR -->
		<nav>
			<i class='bx bx-menu' ></i>
			<a href="#" class="nav-link"></a>
			<form action="#">
				<div class="form-input">
					<input type="search" placeholder="Search...">
					<button type="submit" class="search-btn"><i class='bx bx-search' ></i></button>
				</div>
			</form>
			<input type="checkbox" id="switch-mode" hidden>
			<label for="switch-mode" class="switch-mode"></label>
			<a href="#" class="notification">
				<i class='bx bxs-bell' ></i>
				<span class="num">8</span>
			</a>
			<a href="#" class="profile">
				<img src="img/people.png">
			</a>
		</nav>
		<!-- NAVBAR -->

		<!-- MAIN -->
		<main>
			<div class="head-title">
				<div class="left">
					<!-- <h1>Dashboard</h1> -->
					<ul class="breadcrumb">
						<li>
							<a>Dashboard</a>
						</li>
						<li><i class='bx bx-chevron-right' ></i></li>
						<li>
							<a class="active">Software Engineer</a>
						</li>
					</ul>
			
				</div>
				
				<!-- <a href="#" class="btn-download">
					<i class='bx bxs-cloud' ></i>
					<span class="text">....</span>
				</a> -->
			</div>
<!-- main -->
<br>
    <div class="max-w-6xl mx-auto">
      <div class="bg-white dark:bg-gray-800 shadow-2xl rounded-lg overflow-hidden transition-colors duration-500 border border-green-200 dark:border-green-800">
        <table class="w-full">
          <thead class="bg-green-100 dark:bg-gray-700">
   
            <tr>
                <th  class="text-green-800 dark:text-green-300 font-bold py-4 px-6 text-left"><input type="checkbox" id="select-all" /></th>
                <th  class="text-green-800 dark:text-green-300 font-bold py-4 px-6 text-left">Applicant Id</th>
                <th  class="text-green-800 dark:text-green-300 font-bold py-4 px-6 text-left">Applicant Name</th>
                <th  class="text-green-800 dark:text-green-300 font-bold py-4 px-6 text-left">Applicant Role</th>
                <!-- <th  class="text-green-800 dark:text-green-300 font-bold py-4 px-6 text-left">Email</th>
				<th  class="text-green-800 dark:text-green-300 font-bold py-4 px-6 text-left">Phone Number</th>
                <th  class="text-green-800 dark:text-green-300 font-bold py-4 px-6 text-left">Apply Date</th> -->
                <th  class="text-green-800 dark:text-green-300 font-bold py-4 px-6 text-left">Actions</th>
            </tr>
        </thead>
        <tbody id="applicant-table-body">
           <tr *ngFor="let frontendData of frontendDatas">
			<td><input type="checkbox" class="checkbox" /></td>
			<td>{{frontendData.applicantId}}</td>
			<td>{{frontendData.applicantName}}</td>
			<td>{{frontendData.role}}</td>
			<!-- <td>{{frontendData}}</td> -->
			<td class="actions">
				<a (click)="router.navigate(['job'])"><button class="btn info-btn">Info</button></a>
				<button class="btn info-btn" (click)="router.navigate(['round1', frontendData.applicantId])"><i>Next</i></button>
				<button class="btn info-btn" >Repeat</button>
				<button class="btn1 info-btn">Reject</button>
			  </td>
		   </tr>
        </tbody>
    </table>
</div>
</div>
</main>
</section>

</body>
