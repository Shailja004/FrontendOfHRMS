
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Dashboard</title>
</head>
<body>
  <div class="container">
    <button id="open-dialog" class="button">
      <span>Add Job</span>
    </button>

    <div id="job-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <div id="job-dialog" class="dialog hidden">
    <div class="dialog-content">
      <h2>Add New Job</h2>
      <form id="job-form">
        <label for="role">Role</label>
        <input type="text" id="role" />

        <label for="description">Description</label>
        <textarea id="description"></textarea>

        <label for="experience">Experience</label>
        <input type="text" id="experience" />

        <label for="address">Address</label>
        <input type="text" id="address" />

        <label for="round">Rounds</label>
        <div id="rounds-container"></div>
        <input type="text" id="round-input" placeholder="Enter round name" />
        <button type="button" id="add-round-btn">Add Round</button>

        <button type="button" id="submit-job">Add Job</button>
      </form>
    </div>
  </div>

</body>
