<body>
 
    <div class="container" style="margin-top: 12%;">
      <div class="title">Job Application</div>
      <div class="content">
      
        <form (ngSubmit)="onSubmit()" [formGroup]="registerForm" enctype="multipart/form-data">
          <div class="user-details">
            <div class="input-box">
              <span class="details">First Name</span>
              <input type="text" id="Firstname" formControlName="Firstname" required placeholder="Enter First Name">
            </div>
            <div class="input-box">
              <span class="details">Last Name</span>
              <input type="text" id="Lastname" formControlName="Lastname" required placeholder="Enter Last Name">
            </div>
            <div class="input-box">
              <span class="details">Experience</span>
              <input type="text" id="Experience" formControlName="Experience" required placeholder="Eg. 1 year">
            </div>
            <div class="input-box">
              <span class="details">Highest Qualification</span>
              <input type="text" id="HighestQualification" formControlName="HighestQualification" required placeholder="Eg. graduation, etc">
            </div>
            <div class="input-box">
              <span class="details">Email</span>
              <input type="text" id="Email" formControlName="Email" required placeholder="Enter Email Address">
            </div>
            <div class="input-box">
              <span class="details">Current Address</span>
              <input type="text" id="CurrentAddress" formControlName="CurrentAddress" required placeholder="house no./address/landmark">
            </div>
            <div class="input-box">
              <span class="details">Pincode</span>
              <input type="text" id="Pincode" formControlName="Pincode" required placeholder="Enter Pincode">
            </div>
            <div class="input-box">
              <span class="details">City</span>
              <input type="text" id="City" formControlName="City" required placeholder="Enter City Name">
            </div>
            <div class="input-box">
              <span class="details">Phone Number</span>
              <input type="text" id="PhoneNumber" formControlName="PhoneNumber" required placeholder="Enter Phone No.">
            </div>
            <div class="input-box">
              <span class="details">Platform</span>
              <input type="text" id="Platform" formControlName="Platform" required placeholder="Eg. LinkedIn, Naukri.com, etc">
            </div>
            <div class="input-box">
              <span class="details">Previous Company</span>
              <input type="text" id="PreviousCompanyName" formControlName="PreviousCompanyName" required placeholder="Enter Company Name">
            </div>
            <div class="input-box">
              <span class="details">Current Company</span>
              <input type="text" id="CurrentCompanyName" formControlName="CurrentCompanyName" required placeholder="Enter Company Name">
            </div>
            <div class="input-box">
              <span for="upload" class="details"> Upload Your CV </span>
              <input type="file"  id="ResumeFile" (change)="onFileSelected($event)">
          </div>
            <div class="input-box">
            <span for="JobId" class="details">Job Role</span>
            <select class="form_control input-box" formControlName="jobId" >
              <option value="">Select</option>
              <option *ngFor="let item of items" [value]="item.jobId">{{ item.jobRole }}</option>
            </select>
       
        </div>
    </div>
         
    <div class="button_container">
      <button type="submit" ><b>Apply Now</b></button>
  </div>
        </form>
      </div>
    </div>
  <br>
  <br>
  </body>
