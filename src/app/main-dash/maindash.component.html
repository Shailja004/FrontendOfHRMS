<!-- SIDEBAR -->

<!-- CONTENT -->
<section id="content">
    <!-- NAVBAR -->
    <nav>
        <i class='bx bx-menu'></i>
        <a href="#" class="nav-link"></a>
        <form action="#">
            <div class="form-input">
                <input type="search" placeholder="Search...">
                <button type="submit" class="search-btn"><i class='bx bx-search'></i></button>
            </div>
        </form>
        <input type="checkbox" id="switch-mode" hidden>
        <label for="switch-mode" class="switch-mode"></label>
        <a href="#" class="notification">
            <i class='bx bxs-bell'></i>
            <span class="num">8</span>
        </a>
        <a href="#" class="profile">
            <img src="img/people.png">
        </a>
    </nav>
    <!-- NAVBAR -->
    <!-- MAIN -->
    <main>
        <div class="head-title">
            <div class="left">
                <!-- <h1>Dashboard</h1> -->
                <ul class="breadcrumb">
                    <li>
                        <a href="#">Dashboard</a>
                    </li>
                    <li><i class='bx bx-chevron-right'></i></li>
                    <li>
                        <a class="active" href="#">Home</a>
                    </li>
                </ul>
            </div>

            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Job Dashboard</title>
            </head>

            <body>
                <div class="container">
                    <p-button label="Add Job" (click)="showDialog()"></p-button>
                    <div id="job-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </div>
                <div id="job-dialog" class="dialog hidden">
                    <div class="dialog-content">
                        <h2>Add New Job</h2>

                    </div>
                </div>
                <script src="/src/assets/js/addjob.js"></script>
            </body>
        </div>
        <ul class="box-info " *ngFor="let ActiveJob of ActiveJobs">
            <a href="Front-end Developer"></a>
            <li (click)="redirectTojobapplicantlist(ActiveJob.jobId)">
                <i class='bx bxs-group'></i>
                <span class="text">
                    <h3>{{ActiveJob.jobRole}}</h3>
                    <p>{{ActiveJob.jobDescription}}</p>
                </span>
            </li>
        </ul>
    </main>

</section>
<!-- CONTENT -->

<p-dialog header="Add New Job" [(visible)]="visible" [modal]="true" [style]="{width: '500px'}">
    <form id="job-form" class="form-container" [formGroup]="jobForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="role">Role</label>
            <input formControlName="role" type="text" id="role" class="form-input" />
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea formControlName="description" id="description" class="form-input"></textarea>
        </div>

        <div class="form-group">
            <label for="experience">Experience</label>
            <input formControlName="experience" type="text" id="experience" class="form-input" />
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input formControlName="address" type="text" id="address" class="form-input" />
        </div>

        <div formArrayName="rounds">
            <div *ngFor="let round of rounds.controls; let i = index" [formGroupName]="i">
                <label for="round">Round {{ i + 1 }}</label>
                <input formControlName="roundName" type="text" placeholder="Enter round name" class="form-input" />
                <button type="button" (click)="removeRound(i)">Remove Round</button>
            </div>
        </div>

        <button type="button" (click)="addRound()">Add Round</button><br><br>
        <button type="submit" class="btn">Add Job</button>
    </form>

</p-dialog>
